; PHP settings for the production image.
;
; The development container mounts docker/php.ini instead, which favours quick
; feedback: errors on screen, OPcache revalidating constantly. Neither belongs
; in front of real users.

; Never render an error into a response. The application maps domain exceptions
; to status codes itself (ErrorMapper) and only includes a message when
; APP_DEBUG is on; a PHP warning printed before that would also send the
; headers and turn every status code into 200.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; The code cannot change under a running container, so there is nothing to
; revalidate - checking timestamps on every include would be pure overhead.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; Do not announce the PHP version in the response headers.
expose_php = Off

memory_limit = 256M
max_execution_time = 30
