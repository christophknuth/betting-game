# The production stack: one application container, its database, its identity
# provider.
#
# Deliberately not an extension of docker-compose.yml. That file is a
# development environment - it bind-mounts the repository, runs php-fpm and
# Caddy as separate services, publishes the database and PHPMyAdmin, and ships
# passwords everyone knows. Inheriting from it would mean carrying all of that
# into production and remembering to switch each piece off.
#
#   docker-compose -f docker-compose.prod.yml up -d --build
#
# Everything with a `?` below has no default on purpose: Compose refuses to
# start rather than quietly running production on `secret`.

name: betting-game-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: betting-game:latest
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-betting_game}
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}

      # Reachability: where the API fetches the JWKS from, inside the network.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-betting-game}
      # Identity: what the iss claim of a browser's token says, compared
      # verbatim. This is the public URL, not the internal one - the single
      # most common way to end up with 401 on a perfectly good token.
      KEYCLOAK_ISSUER: ${PUBLIC_KEYCLOAK_URL:?set PUBLIC_KEYCLOAK_URL}/realms/${KEYCLOAK_REALM:-betting-game}

      # Read by the entrypoint, not by PHP: these become the SPA's config.js at
      # container start, which is what lets one image serve more than one
      # environment.
      KEYCLOAK_PUBLIC_URL: ${PUBLIC_KEYCLOAK_URL:?set PUBLIC_KEYCLOAK_URL}
      KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID:-betting-game-frontend}
    ports:
      # The container listens on 8080 as a non-root user. Terminating TLS is a
      # reverse proxy's job; bind to localhost so nothing else is exposed.
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - betting-game

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-betting_game}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
      MARIADB_USER: ${DB_USERNAME:?set DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # Runs only into an empty data directory. A schema change on a database
      # that already has data needs a migration by hand - see DOCKER.md.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=512M
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MARIADB_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No published port: only the application talks to it.
    networks:
      - betting-game

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${PUBLIC_KEYCLOAK_URL:?set PUBLIC_KEYCLOAK_URL}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    # `start`, not `start-dev`: the development mode disables hostname checks
    # and caching, neither of which belongs in front of real users. Note that
    # this does not import a realm - production realms are configured once and
    # backed up, not recreated from a file on every deploy.
    command: ["start", "--optimized"]
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      - keycloak-db
    networks:
      - betting-game

  keycloak-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      # From PostgreSQL 18 on the mount belongs here, not on its data/
      # subdirectory - see docker-compose.yml for why.
      - keycloak_db_data:/var/lib/postgresql
    networks:
      - betting-game

networks:
  betting-game:
    driver: bridge

volumes:
  db_data:
  keycloak_db_data:
