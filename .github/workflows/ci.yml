# Four separate jobs instead of one: static analysis is done in a minute, the
# end-to-end pass needs the whole stack including the Keycloak import. Bundled
# into one job, every piece of feedback would wait on the slowest part.
name: CI

on:
  push:
    branches: [main, Refocus-project]
  pull_request:

jobs:
  static:
    name: PHPStan + PSR-12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Level 10, see phpstan.neon. The codebase is clean - keep it that way.
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PSR-12
        run: vendor/bin/phpcs --standard=PSR12 src tests public config

  php-tests:
    name: PHPUnit
    runs-on: ubuntu-latest

    services:
      # The database name ends in `_test` because IntegrationTestCase refuses
      # anything else: the suite truncates every table before each test, and
      # that guard keeps it from ever hitting a development database.
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: betting_game_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -psecret --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v5

      # `coverage: pcov`, not `none`: phpunit.xml configures coverage reports,
      # and without a driver PHPUnit emits a warning - warnings mean exit 1, so
      # the job fails even though no test is broken.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, json
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Through the mariadb image rather than a client on the runner: that way
      # the step does not depend on whichever client version the runner image
      # currently ships.
      - name: Load schema
        run: |
          docker run --rm -i --network host mariadb:11.4 \
            mariadb -h 127.0.0.1 -uroot -psecret betting_game_test < database/schema.sql

      # `--fail-on-skipped` is the actual point here: without a reachable
      # database the integration tests skip themselves and still report green.
      # That must not pass in CI, because such a run says nothing about
      # persistence. A database stands ready here, so any skip is a failure.
      - name: PHPUnit
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: betting_game_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: vendor/bin/phpunit --testdox --fail-on-skipped

  frontend-unit:
    name: ESLint + Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The codebase is clean; eslint:recommended + vue3-recommended.
      - run: npm run lint

      - run: npm test

  e2e:
    name: Playwright (full stack)
    runs-on: ubuntu-latest
    # The slowest job: Keycloak imports its realm on the first start.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, json
          coverage: none

      # docker-compose.yml mounts the repository at /var/www/html and thereby
      # covers up the vendor/ from the image. Without this step the container
      # finds no autoloader.
      - name: Install PHP dependencies for the bind mount
        run: composer install --no-interaction --no-progress

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `var/cache` holds the compiled DI container and the JWKS cache, written
      # by php-fpm as `www-data`. The checkout belongs to the runner user here,
      # and the bind mount carries those ownership bits into the container -
      # without this step every authenticated route fails with `Permission
      # denied` and thus `500`. It goes unnoticed locally, where the container
      # user is mapped onto the host user.
      - name: Make var/ writable for php-fpm
        run: chmod -R 777 var

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health >/dev/null && exit 0
            sleep 2
          done
          echo "::error::API did not become reachable"
          docker compose logs caddy php
          exit 1

      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:8090/realms/betting-game >/dev/null && exit 0
            sleep 2
          done
          echo "::error::Keycloak did not import its realm"
          docker compose logs keycloak
          exit 1

      # Creating participants does have a route since B-21, but the demo IDs
      # have to match the realm's `participant_id` claims - and those are fixed
      # there. Hence still via the seed.
      - name: Seed demo participants
        run: |
          docker compose exec -T db mariadb -uroot -psecret betting_game \
            < database/seed-demo-participants.sql

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Collect stack logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-artifacts
          path: frontend/test-results/
          retention-days: 7
